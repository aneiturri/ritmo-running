function runStats(list){const runs=list.filter(isRun),done=runs.filter(completed).length,partial=runs.filter(s=>getRec(s).status==='partial').length;return {total:runs.length,done,partial,percent:runs.length?Math.round(done/runs.length*100):0}}

function renderRunningRings(ws){const week=runStats(ws),all=runStats(sessions),due=runStats(sessions.filter(s=>s.date<=today()));return `<section class="card progress-summary" aria-label="Progreso de tus entrenamientos de running"><div class="ring-block">${ringGraphic(week,'Esta semana')}<div class="ring-copy"><span class="label">ESTA SEMANA</span><h3>${week.done} de ${week.total} salidas</h3><p>${week.percent===100?'Semana completada. Bien trabajado.':'Cada salida suma a tu constancia.'}</p>${week.partial?`<small>${week.partial} parcial${week.partial>1?'es':''}</small>`:''}</div></div><div class="ring-block">${ringGraphic(all,'Plan completo','lime')}<div class="ring-copy"><span class="label">PLAN COMPLETO</span><h3>${all.done} de ${all.total} salidas</h3><p>Tu camino hasta la media maratón.</p></div></div><div class="progress-context"><span class="context-icon">↗</span><span class="label">HASTA HOY</span><h3>${due.done} de ${due.total} previstas</h3><p>Contamos las sesiones de running completadas. Las parciales se muestran aparte.</p></div></section>`}

function actualWeekIndex(){return Math.max(0,Math.min(weeks.length-1,Math.floor((new Date(today()+'T12:00:00Z')-new Date(weeks[0].start+'T12:00:00Z'))/604800000)))}

function renderWeekNavigator(){const w=currentWeek();return `<section class="week-navigator" id="weeknavigator" aria-label="Navegar entre las semanas del plan"><button class="icon-button week-arrow" id="prevweek" aria-label="Semana anterior" ${selectedWeek===0?'disabled':''}>←</button><button class="week-current" id="openweekpicker" aria-haspopup="dialog"><span class="label">SEMANA ${w.n} <span class="week-separator">/ 22</span></span><strong>${weekRange(w)} <span aria-hidden="true">⌄</span></strong><small>${esc(w.phase)}</small></button><button class="icon-button week-arrow" id="nextweek" aria-label="Semana siguiente" ${selectedWeek===weeks.length-1?'disabled':''}>→</button></section><div class="week-subline"><span><span class="tiny-dot"></span> ${weekSessions(w).filter(isRun).length} sesiones de running · ${weekSessions(w).filter(isRun).reduce((n,s)=>n+s.km,0).toFixed(1)} km previstos</span><button class="text-button" id="week-today">Ir a esta semana</button></div>${renderWeekPicker()}`}

function renderCoach(){return `<div class="heading"><div><span class="label">ENTRENAR CON CABEZA</span><h1>Constancia antes que prisa.</h1><p class="muted">Tu punto de partida: 2 × 7 km por semana, cerca de 6 min/km, sin limitaciones conocidas.</p></div></div><div class="guidegrid"><article class="card"><span class="label">TU SEMANA</span><h2 style="margin-top:9px">Un plan que cabe en tu vida.</h2><div class="pace"><b>Lunes · 18:45</b><span>Carrera / calidad controlada</span></div><div class="pace"><b>Martes · 18:45</b><span>Fuerza en casa · 15–20 min</span></div><div class="pace"><b>Miércoles · 18:45</b><span>Tirada larga · hasta 110 min</span></div><div class="pace"><b>Jueves · 18:45</b><span>3 km muy suaves o descanso</span></div><div class="pace"><b>Viernes · 19:00</b><span>Pádel, ajustado antes de carreras</span></div><div class="pace"><b>Sábado y domingo</b><span>Libres, excepto los dorsales</span></div><p>18:45 deja margen desde tu salida del trabajo a las 18:00. La primera semana pasa de unas dos salidas a tres más cortas, sin disparar el volumen.</p></article><article class="card"><span class="label">INTENSIDAD</span><h2 style="margin-top:9px">El esfuerzo manda.</h2><div class="pace"><b>Recuperación · RPE 2–3</b><span>Conversación muy fácil</span></div><div class="pace"><b>Suave / fondo · RPE 3–4</b><span>Frases completas</span></div><div class="pace"><b>Controlado · RPE 5–6</b><span>Frases cortas, sin agotarte</span></div><div class="pace"><b>Bloques 10K · RPE 6–7</b><span>Exigente pero repetible</span></div><p>RPE es esfuerzo percibido de 1 a 10. 6:15–7:00/km es una orientación inicial para suave, no una obligación. Puedes ir más despacio o caminar. No conviertas cada entrenamiento en una prueba.</p><p>Objetivo 10K: empieza valorando 55 min. Los controles de diciembre y enero ayudan a decidir; si exigen esfuerzo excesivo, revisa el objetivo en lugar de forzarlo.</p></article><article class="card"><span class="label">FUERZA SIN GIMNASIO</span><h2 style="margin-top:9px">Tu casa es suficiente.</h2><p>2 min de movilidad al empezar. Dos vueltas, 45–60 s entre ejercicios; esfuerzo moderado y técnica tranquila.</p><ol><li><b>Sentadilla a una silla estable:</b> 8–12 repeticiones.</li><li><b>Puente de glúteos en el suelo:</b> 10–12 repeticiones.</li><li><b>Elevaciones de gemelos:</b> 12–15, con apoyo en pared.</li><li><b>Bird-dog:</b> 6 por lado, lento y estable.</li><li><b>Plancha lateral con rodillas apoyadas:</b> 15–25 s por lado.</li></ol><p>Primera semana: una vuelta si no haces fuerza habitualmente. Desde la segunda, dos si has recuperado bien. No hace falta comprar material. En semanas de carrera: movilidad suave.</p></article><article class="card"><span class="label">CÓMO AJUSTAR</span><h2 style="margin-top:9px">Recuperar también es entrenar.</h2><ul><li>Si fallas una sesión, continúa con la siguiente. No juntes dos sesiones exigentes para compensar.</li><li>Con cansancio claro, mal sueño o piernas muy cargadas: descanso o paseo. El jueves es el primer rodaje que puedes quitar.</li><li>Si llevas una semana sin correr, vuelve con dos salidas suaves de unos 20–30 min y ajusta el resto. No saltes directamente a la tirada pendiente.</li><li>Si la tirada anterior no se asimiló, repite o reduce. La de 18 km es un máximo orientativo; el límite es 110 min y llegar sin molestias.</li><li>Si el dolor cambia tu forma de correr, aumenta o persiste, para y consulta. Con dolor torácico, desmayo o falta de aire anormal, interrumpe el ejercicio y solicita atención.</li></ul></article><article class="card"><span class="label">ENERGÍA Y LOGÍSTICA</span><h2 style="margin-top:9px">Ensaya antes del dorsal.</h2><p>Come de forma suficiente y regular. Antes de correr tras el trabajo, prueba una merienda sencilla 60–90 min antes si la necesitas; no estrenes nada el día de carrera.</p><p>En tiradas de más de 75–90 min, practica pequeñas tomas de hidratos y agua que toleres. Empieza con lo que te siente bien y ajusta; no fuerces grandes cantidades ni bebas por obligación.</p><p>Lleva móvil y elementos reflectantes para las tardes de invierno. Elige rutas iluminadas y seguras. En temporal, cambia la sesión por descanso o movilidad en casa.</p></article><article class="card"><span class="label">FUENTES Y CRITERIO</span><h2 style="margin-top:9px">Un plan personal, revisable.</h2><p>Diseñado a partir de tus horarios y nivel declarado. No es un plan oficial de las carreras. Revisa la carga tras las primeras dos semanas y después de cada dorsal.</p><p><a href="https://www.nhs.uk/better-health/get-active/get-running-with-couch-to-5k/" target="_blank" rel="noopener">NHS: progresión y recuperación al empezar</a></p><p><a href="https://www.bhf.org.uk/-/media/files/how-you-can-help/events/events-rebranded-training-plans/10k-run-beginners.pdf" target="_blank" rel="noopener">British Heart Foundation: referencia de entrenamiento 10K</a></p><p>Fechas contrastadas con las webs de las organizaciones el 29 de octubre de 2026. San Silvestre: 7,9 km; 10K: 14/02/2027; media: 04/04/2027.</p></article></div>`}
let passwordRecovery=false;

 return '<form id="passwordlogin"><label class="field">Tu correo electrónico<input id="passwordemail" type="email" required autocomplete="username" value="'+esc(load('dr-last-email',''))+'" placeholder="tu@email.com"></label><label class="field">Contraseña de Ritmo<input id="password" type="password" required autocomplete="current-password"></label><button class="btn" id="passwordloginbtn" '+(!sb?'disabled':'')+'>Entrar y mantener sesión</button><button type="button" class="btn plain" id="recoverpassword" '+(!sb||Date.now()<load('dr-email-blocked-until',0)?'disabled':'')+'>Crear o recuperar mi contraseña</button><p id="authresult" class="statusNote" role="status"></p></form><p class="statusNote">Una vez dentro, no tendrás que identificarte en cada entrenamiento. Si ya tienes Ritmo abierto con tu cuenta en otro navegador, desde allí puedes establecer una contraseña en Cuenta.</p>'+browserNote+'<details class="note"><summary>Acceso alternativo por correo</summary><p>Para el primer acceso o si aún no has establecido una contraseña. Envía un solo enlace y ábrelo en el mismo navegador donde usarás Ritmo.</p><form id="loginform"><label class="field">Correo para el enlace<input id="email" type="email" required autocomplete="email" value="'+esc(load('dr-last-email',''))+'" placeholder="tu@email.com"></label><button class="btn light" id="loginbtn" '+(!sb||Date.now()<load('dr-email-blocked-until',0)?'disabled':'')+'>Enviar un enlace de acceso</button><p id="emailresult" class="statusNote" role="status">'+(Date.now()<load('dr-email-blocked-until',0)?'El servicio ha limitado temporalmente los correos. No se pedirán más automáticamente. Usa tu contraseña o una sesión que ya tengas abierta.':'No se envía ningún correo al navegar ni al registrar entrenamientos.')+'</p></form></details>';

function authErrorMessage(error){if(error?.status===429||/rate|limit/i.test(error?.message||''))return 'El servicio ha limitado temporalmente los intentos. No solicites más correos; usa tu contraseña o una sesión ya abierta.';if(/invalid login credentials/i.test(error?.message||''))return 'El correo o la contraseña de Ritmo no coinciden. Si no has creado una contraseña, establécela desde el navegador donde ya tienes una sesión abierta.';return error?.message||'No se ha podido conectar. Tus registros guardados no se han borrado.'}
function bindAuthForms(){
 const recovery=$('#recoverpassword');if(recovery)recovery.onclick=async()=>{const input=$('#passwordemail'),email=input.value.trim(),output=$('#authresult');if(!email||!input.reportValidity())return;if(Date.now()<load('dr-email-blocked-until',0)){output.textContent='El envío de correos sigue limitado temporalmente. Espera antes de volver a solicitarlo.';return}recovery.disabled=true;try{await connectCloud();if(!sb)throw Error('No hay conexión con el servicio.');const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)throw error;save('dr-last-email',email);save('dr-email-blocked-until',Date.now()+60000);output.textContent='Revisa tu correo. Abre el enlace en Safari o Chrome y elige tu contraseña de Ritmo una sola vez.'}catch(error){if(error.status===429||/rate|limit/i.test(error.message||''))save('dr-email-blocked-until',Date.now()+3600000);output.textContent=authErrorMessage(error)}finally{recovery.disabled=Date.now()<load('dr-email-blocked-until',0)}};

 const form=$('#passwordlogin');if(form)form.onsubmit=async e=>{e.preventDefault();const email=$('#passwordemail').value.trim(),password=$('#password').value,button=$('#passwordloginbtn'),output=$('#authresult');button.disabled=true;output.textContent='Entrando…';try{await connectCloud();if(!sb)throw Error('No hay conexión con el servicio. Reintenta cuando tengas Internet.');const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;save('dr-last-email',email);$('#password').value='';await applySession(data.session);toast('Sesión guardada en este navegador.');render()}catch(error){output.textContent=authErrorMessage(error)}finally{button.disabled=false}};
 const setup=$('#passwordsetup');if(setup)setup.onsubmit=async e=>{e.preventDefault();const password=$('#newpassword').value,repeated=$('#repeatpassword').value,output=$('#passwordresult'),button=$('#savepassword');if(password!==repeated){output.textContent='Las contraseñas no coinciden.';return}button.disabled=true;output.textContent='Guardando…';try{const {error}=await sb.auth.updateUser({password});if(error)throw error;$('#newpassword').value='';$('#repeatpassword').value='';passwordRecovery=false;output.textContent='Contraseña guardada. Puedes usarla con el mismo correo en el otro dispositivo.';toast('Contraseña de Ritmo guardada. Ya puedes usarla en el otro dispositivo.')}catch(error){output.textContent=authErrorMessage(error)}finally{button.disabled=false}};
 const emailForm=$('#loginform');if(emailForm)emailForm.onsubmit=async e=>{e.preventDefault();const button=$('#loginbtn'),output=$('#emailresult'),email=$('#email').value.trim();if(Date.now()<load('dr-email-blocked-until',0)){output.textContent='El límite de correos sigue activo. Usa la contraseña o una sesión abierta.';return}button.disabled=true;output.textContent='Solicitando un único enlace…';try{await connectCloud();if(!sb)throw Error('No hay conexión con el servicio.');const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});if(error)throw error;save('dr-last-email',email);save('dr-email-blocked-until',Date.now()+60000);output.textContent='Enlace enviado. Ábrelo en el mismo navegador. No hace falta volver a solicitarlo.'}catch(error){if(error.status===429||/rate|limit/i.test(error.message||''))save('dr-email-blocked-until',Date.now()+3600000);output.textContent=authErrorMessage(error)}finally{button.disabled=Date.now()<load('dr-email-blocked-until',0)}};
}
function renderSettings(){return `<div class="heading"><div><span class="label">TU ESPACIO PERSONAL</span><h1>Contigo, en cada dispositivo.</h1><p class="muted">Supabase guarda tu diario; GitHub Pages sirve la app.</p></div></div><div class="settings"><section class="card"><h2>${user?'Tu cuenta está conectada':'Entra una vez y sigue entrenando'}</h2><p class="muted">${user?esc(user.email):'La conexión está preparada. Entra con el mismo correo en móvil y ordenador: verás tus entrenamientos en ambos.'}</p><p class="statusNote">${esc(syncMessage)}</p>${renderAuthPanel()}</section><details class="card"><summary>Configuración avanzada de conexión</summary><h2 style="margin-top:16px">Conexión con Supabase</h2><p class="muted">Esta configuración es pública. Introduce solo Project URL y una clave publishable o anon.</p><form id="configform"><label class="field">Project URL<input type="url" id="sburl" value="${esc(config.url)}" required placeholder="https://tu-proyecto.supabase.co"></label><label class="field">Clave pública (publishable / anon)<input id="sbkey" value="${esc(config.key)}" required placeholder="sb_publishable_…" autocomplete="off"></label><button class="btn light">Guardar configuración</button></form><p class="warning">Nunca introduzcas service_role ni sb_secret. El archivo schema.sql debe ejecutarse antes de usar la nube. En la versión publicada, la URL y la clave pública ya están preconfiguradas.</p></details><section class="card"><h2>Tus datos, bajo tu control.</h2><p>La exportación incluye únicamente tus registros, sin contraseña ni tokens. Puedes usarla como copia de seguridad y para recuperar registros de otro navegador.</p><div class="toolbar"><button class="btn light" id="exportdata">Exportar JSON ↓</button><label class="btn light" style="cursor:pointer">Importar JSON ↑<input id="importdata" type="file" accept="application/json,.json" style="display:none"></label></div><p class="statusNote">Importar combina por sesión: conserva el registro con fecha de modificación más reciente. La sincronización también se actualiza al volver a abrir la pestaña y cada 30 segundos mientras esté visible.</p></section><details class="card"><summary>Ayuda técnica de configuración</summary><h2 style="margin-top:16px">Configuración inicial</h2><ol style="font-size:13px;padding-left:20px"><li>Crea un proyecto en Supabase y ejecuta <code>schema.sql</code> en SQL Editor.</li><li>En Authentication → URL Configuration, autoriza la URL exacta de GitHub Pages como Site URL y Redirect URL.</li><li>Configura la URL y la clave pública en esta pantalla, o en DEFAULT_CONFIG del HTML antes de publicarlo.</li><li>Entra con el mismo correo en ambos dispositivos.</li></ol><p class="statusNote">En un archivo abierto con file://, el plan y el guardado local funcionan, pero la autenticación necesita una web HTTP/HTTPS autorizada. El indicador solo muestra «Sincronizado» después de consultar la nube correctamente.</p></details></div>`}
function bindView(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>nav(b.dataset.go));document.querySelectorAll('[data-log]').forEach(b=>b.onclick=()=>openLog(b.dataset.log));if($('#prevweek'))$('#prevweek').onclick=()=>setWeek(selectedWeek-1);if($('#nextweek'))$('#nextweek').onclick=()=>setWeek(selectedWeek+1);if($('#weekselect'))$('#weekselect').onchange=e=>{selectedWeek=Number(e.target.value);render()};if($('#exportdata'))$('#exportdata').onclick=exportData;if($('#importdata'))$('#importdata').onchange=importData;if($('#configform'))$('#configform').onsubmit=async e=>{e.preventDefault();let url=$('#sburl').value.trim().replace(/\/$/,''),key=$('#sbkey').value.trim();try{const u=new URL(url);if(u.protocol!=='https:'||!u.hostname.endsWith('.supabase.co')||u.username||u.password)throw Error('Usa la URL HTTPS de tu proyecto *.supabase.co.');if(key.startsWith('sb_secret_'))throw Error('Esa es una clave secreta. Usa una publishable.');if(key.startsWith('ey')){let p=JSON.parse(atob(key.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));if(p.role!=='anon')throw Error('Solo se permite la clave anon, nunca service_role.')}else if(!key.startsWith('sb_publishable_'))throw Error('La clave debe ser publishable o anon.');config={url,key};if(!save('dr-config',config))return;await connectCloud();render();toast('Configuración guardada. Inicia sesión.')}catch(err){toast(err.message)}};if($('#logout'))$('#logout').onclick=async()=>{if(Object.keys(pending).length&&!confirm('Hay cambios pendientes de subir. Exporta una copia antes de cerrar sesión. ¿Continuar?'))return;const {error}=await sb.auth.signOut({scope:'local'});if(error)return toast(error.message);user=null;records=localRecords;pending={};cloudReady=false;setSync('Guardado en este dispositivo');render()};if($('#syncnow'))$('#syncnow').onclick=()=>syncCloud(true);if($('#migratelocal'))$('#migratelocal').onclick=async()=>{if(!confirm('¿Combinar los registros de este dispositivo con tu cuenta? Se conserva el más reciente por sesión.'))return;for(const [id,r] of Object.entries(localRecords))if(!records[id]||r.updated_at>records[id].updated_at){records[id]=r;pending[id]=r}persistCloudCache();await syncCloud(true)};bindDashboardControls();bindAuthForms()}
async function openLog(id){const target=sessions.find(s=>s.id===id);if(!target||!isRun(target))return;if(config.url&&config.key&&!user){setSync('Recuperando tu sesión…');await restoreSession();if(!user){nav('settings');toast('Entra una vez para guardar tus entrenamientos en la nube.');return}}currentSession=target;const r=getRec(currentSession);$('#logtitle').textContent=currentSession.title;$('#logdate').textContent=date(currentSession.date,{weekday:'long',day:'numeric',month:'long',year:'numeric'});$('#logstatus').value=r.status||'done';$('#logkm').value=r.km??'';$('#logmin').value=r.minutes??'';$('#logrpe').value=r.rpe??'';$('#lognotes').value=r.notes||'';$('#logkm').disabled=!isRun(currentSession);$('#logdialog').showModal()}
$('#closelog').onclick=()=>$('#logdialog').close();for(let i=1;i<=10;i++){let o=document.createElement('option');o.value=i;o.textContent=i+(i===1?' · Muy fácil':i===10?' · Máximo':'');$('#logrpe').append(o)}
$('#logform').onsubmit=async e=>{e.preventDefault();let s=currentSession;if(!s||!isRun(s))return;let r={status:$('#logstatus').value,km:isRun(s)&&$('#logkm').value!==''?Number($('#logkm').value):null,minutes:$('#logmin').value!==''?Number($('#logmin').value):null,rpe:$('#logrpe').value?Number($('#logrpe').value):null,notes:$('#lognotes').value.trim(),updated_at:new Date().toISOString()};if((r.status==='skipped'||r.status==='planned')&&(r.km>0||r.minutes>0))return toast('Para registrar actividad real, elige completa o parcial.');records[s.id]=r;let stored;if(user){pending[s.id]=r;stored=persistCloudCache()}else{localRecords=records;stored=save('dr-local',records)}if(!stored)return;$('#logdialog').close();render();toast(user?'Guardado en este dispositivo. Subiendo a la nube…':'Sesión guardada en este dispositivo.');if(user)await syncCloud(false)};
function exportData(){const b=new Blob([JSON.stringify({version:1,plan:PLAN_VERSION,exported_at:new Date().toISOString(),records},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ritmo-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function validRecord(id,r){return sessions.some(s=>s.id===id)&&r&&['planned','done','partial','skipped'].includes(r.status)&&[r.km,r.minutes].every(v=>v===null||(typeof v==='number'&&Number.isFinite(v)&&v>=0))&&(r.km===null||r.km<=100)&&(r.minutes===null||r.minutes<=1000)&&(r.rpe===null||(Number.isInteger(r.rpe)&&r.rpe>=1&&r.rpe<=10))&&typeof r.notes==='string'&&r.notes.length<=2000&&typeof r.updated_at==='string'&&Number.isFinite(Date.parse(r.updated_at))&&Date.parse(r.updated_at)<=Date.now()+60000}
async function importData(e){try{const file=e.target.files[0];if(!file)return;if(file.size>2000000)throw Error('El archivo supera 2 MB.');const j=JSON.parse(await file.text());if(j.plan!==PLAN_VERSION||j.version!==1||!j.records||typeof j.records!=='object'||Array.isArray(j.records))throw Error('No es una copia válida de este plan.');const entries=Object.entries(j.records);if(!entries.every(([id,r])=>validRecord(id,r)))throw Error('La copia contiene registros no válidos.');let count=0;for(const [id,r] of entries)if(!records[id]||r.updated_at>records[id].updated_at){records[id]={status:r.status,km:r.km,minutes:r.minutes,rpe:r.rpe,notes:r.notes,updated_at:r.updated_at};if(user)pending[id]=records[id];count++}if(user){persistCloudCache();await syncCloud(false)}else{localRecords=records;save('dr-local',records)}render();toast(count+' registros importados.')}catch(err){toast(err.message)}}
let cloudConnecting=null,syncBusy=false;
function persistCloudCache(){return save('dr-cloud-'+user.id,{records,pending})}
async function sdk(){if(window.supabase)return window.supabase;return await new Promise((resolve,reject)=>{const old=$('#supabase-sdk');if(old)old.remove();let s=document.createElement('script');s.id='supabase-sdk';s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js';s.onload=()=>resolve(window.supabase);s.onerror=()=>reject(Error('No se puede cargar Supabase. Comprueba la conexión.'));document.head.append(s)})}
let authInitializing=null,clientIdentity='',authRestoreError=false;
function persistentStorage(){const probe='dr-storage-check';localStorage.setItem(probe,'1');if(localStorage.getItem(probe)!=='1')throw Error('Este navegador no puede conservar tu sesión. Abre Ritmo directamente en Safari o Chrome, fuera de Teams y sin navegación privada.');localStorage.removeItem(probe);return localStorage}
async function connectCloud(){
 if(!config.url||!config.key)return;
 if(authInitializing)return authInitializing;
 if(sb&&clientIdentity===config.url+'|'+config.key)return;
 authInitializing=(async()=>{try{
  const storage=persistentStorage(),lib=await sdk();
  if(channel&&sb){await sb.removeChannel(channel);channel=null}
  if(sb?.authListener)sb.authListener.unsubscribe();
  clientIdentity=config.url+'|'+config.key;
  sb=lib.createClient(config.url,config.key,{auth:{storage,storageKey:'sb-'+new URL(config.url).hostname.split('.')[0]+'-auth-token',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'implicit'}});
  const {data:listener}=sb.auth.onAuthStateChange((event,session)=>{setTimeout(()=>{applySession(session);if(event==='PASSWORD_RECOVERY'){passwordRecovery=true;nav('settings')}},0)});sb.authListener=listener.subscription;
  const {data,error}=await sb.auth.getSession();if(error)throw error;authRestoreError=false;await applySession(data.session);
 }catch(error){authRestoreError=true;setSync(user?'Sin conexión · cambios pendientes':'No se pudo recuperar la sesión');toast(authErrorMessage(error));}finally{authInitializing=null;if(tab==='settings')render()}})();return authInitializing;
}
async function restoreSession(){
 await connectCloud();if(!sb)return false;
 try{const {data,error}=await sb.auth.getSession();if(error)throw error;authRestoreError=false;if(data.session)await applySession(data.session);return !!user}
 catch(error){authRestoreError=true;setSync(user?'Sin conexión · cambios pendientes':'No se pudo recuperar la sesión');return !!user}
}
async function resumeSession(){if(!document.hidden){if(!user||authRestoreError)await restoreSession();if(user)await syncCloud(false)}}
async function applySession(session){const nextUser=session?.user||null;if(nextUser?.id===user?.id){if(nextUser){user=nextUser;syncCloud(false)}else setSync('Entra una vez · sesión recordada');return}if(channel&&sb){await sb.removeChannel(channel);channel=null}user=nextUser;cloudReady=false;if(user){let cached=load('dr-cloud-'+user.id,{records:{},pending:{}});records=cached.records;pending=cached.pending;setSync('Conectando con tus datos…');await syncCloud(false);channel=sb.channel('runner-'+user.id).on('postgres_changes',{event:'*',schema:'public',table:'training_logs',filter:'user_id=eq.'+user.id},()=>syncCloud(false)).subscribe()}else{records=localRecords;pending={};setSync('Entra una vez · sesión recordada')}render()}
async function syncCloud(notify=false){if(!sb||!user||syncBusy)return;syncBusy=true;let uid=user.id,recordsBefore=JSON.stringify(records);setSync('Sincronizando…');try{const {data,error}=await sb.from('training_logs').select('session_id,status,km,minutes,rpe,notes,updated_at');if(error)throw error;if(user?.id!==uid)return;for(const row of data){let {session_id,...r}=row;if(!pending[session_id]&&validRecord(session_id,r))records[session_id]=r}for(const [id,r] of Object.entries({...pending})){const {data:saved,error:writeError}=await sb.rpc('save_training_log',{p_session_id:id,p_status:r.status,p_km:r.km,p_minutes:r.minutes,p_rpe:r.rpe,p_notes:r.notes,p_client_updated_at:r.updated_at});if(writeError)throw writeError;if(user?.id!==uid)return;if(pending[id]?.updated_at===r.updated_at){delete pending[id];let returned=Array.isArray(saved)?saved[0]:saved;if(returned){let {session_id,user_id,client_updated_at,...v}=returned;records[id]=v}}}cloudReady=true;persistCloudCache();setSync(Object.keys(pending).length?'Cambios pendientes · reintentar':'Sincronizado · '+new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}),!Object.keys(pending).length);if(notify)toast(Object.keys(pending).length?'Hay cambios nuevos pendientes de sincronizar.':'Tus registros están sincronizados.');if(tab==='plan'){planNeedsRefresh=planNeedsRefresh||recordsBefore!==JSON.stringify(records);if(planNeedsRefresh&&!$('#weekpicker')?.open){planNeedsRefresh=false;render()}};if(tab==='home'||tab==='progress'||tab==='settings'&&!document.activeElement?.closest?.('form'))render()}catch(err){if(user?.id===uid){persistCloudCache();setSync(Object.keys(pending).length?'Cambios pendientes · reintentar':'Nube no disponible · copia local');if(notify)toast('No se ha podido sincronizar: '+err.message)}}finally{syncBusy=false}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>nav(b.dataset.tab));$('#syncbtn').onclick=()=>nav('settings');document.addEventListener('visibilitychange',resumeSession);window.addEventListener('online',resumeSession);window.addEventListener('pageshow',resumeSession);setInterval(()=>{if(!document.hidden)syncCloud(false)},30000);if(config.url&&config.key)setSync('Recuperando tu sesión…');render();connectCloud();
</script></body></html>
